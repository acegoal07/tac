name: Publish

on:
   release:
      types: [published]

   workflow_dispatch:
      inputs:
         tag:
            description: GitHub tag to publish
            type: string
            required: true

permissions:
   contents: read
   id-token: write

jobs:
   publish:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout
           uses: actions/checkout@v7
           with:
              ref: ${{ github.event.release.tag_name || inputs.tag }}

         - name: Setup Node
           uses: actions/setup-node@v7
           with:
              node-version: 24
              registry-url: https://registry.npmjs.org
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Build
           run: npm run build

         - name: Publish
           run: npm publish --provenance --access public
